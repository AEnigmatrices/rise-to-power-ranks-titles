name: One-time dependency refresh
on:
  push:
    branches:
      - chore/dependency-refresh-2026-09

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Set up pnpm 12.7.0
        uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
          run_install: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Upgrade direct dependencies and regenerate lockfile
        run: |
          pnpm install --no-frozen-lockfile
          pnpm update --latest
          # Astro tooling uses the TypeScript 6 language service; do not cross to TS 7.
          # Playwright's GitHub Actions browser image is pinned to v1.63.0.
          pnpm add --save-dev 'typescript@~6.0.3' '@types/node@^24' '@playwright/test@1.63.0'
          pnpm install --frozen-lockfile
      - name: Check project and updated dependency graph
        run: |
          pnpm validate
          pnpm build:site
          pnpm index:search
      - name: Commit manifest and regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "chore: update direct libraries and pnpm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
